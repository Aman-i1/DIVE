[package]
name = "dive-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Aman-i1"]
description = "WebAssembly client-side zero-server dataset auditing engine for DIVE"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
sha2 = "0.10"
