[package]
name = "dive-core"
version = "0.1.0"
edition = "2021"
authors = ["Aman-i1"]
description = "High-performance SIMD vectorized ML reliability and target leakage engine written in Rust"

[lib]
name = "dive_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rayon = "1.8"

[features]
default = []
python = ["pyo3"]

[dependencies.pyo3]
version = "0.20"
optional = true
features = ["extension-module"]
